<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
  <title id="title">CineLock booking journey</title>
  <desc id="desc">Discover a film, choose a cinema, select seats, pay, and receive a QR ticket.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff5f2"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#192437" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1100" height="250" rx="24" fill="url(#bg)"/>
  <path d="M153 105H948" stroke="#e7c9c3" stroke-width="3" stroke-dasharray="9 8"/>
  <g filter="url(#shadow)" fill="#fff"><rect x="28" y="39" width="190" height="166" rx="18"/><rect x="247" y="39" width="190" height="166" rx="18"/><rect x="466" y="39" width="190" height="166" rx="18"/><rect x="685" y="39" width="190" height="166" rx="18"/><rect x="904" y="39" width="168" height="166" rx="18"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g fill="#df3b32"><circle cx="123" cy="83" r="25"/><circle cx="342" cy="83" r="25"/><circle cx="561" cy="83" r="25"/><circle cx="780" cy="83" r="25"/><circle cx="988" cy="83" r="25"/></g>
    <g fill="#fff" font-size="16" font-weight="700"><text x="123" y="89">01</text><text x="342" y="89">02</text><text x="561" y="89">03</text><text x="780" y="89">04</text><text x="988" y="89">05</text></g>
    <g fill="#222831" font-size="16" font-weight="700"><text x="123" y="137">Discover films</text><text x="342" y="137">Pick a cinema</text><text x="561" y="137">Choose seats</text><text x="780" y="137">Pay securely</text><text x="988" y="137">Get your ticket</text></g>
    <g fill="#687386" font-size="12"><text x="123" y="162">Search movies and genres</text><text x="342" y="162">Find a city and showtime</text><text x="561" y="162">Availability and timed hold</text><text x="780" y="162">Gateway verifies payment</text><text x="988" y="162">Booking QR and PDF</text></g>
